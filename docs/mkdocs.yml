site_name: Odyssey Documentation
site_url: https://Egorich88.github.io/odyssey-kafka/
site_description: Kafka Monitoring & Management
repo_url: https://github.com/Egorich88/odyssey-kafka
repo_name: Egorich88/odyssey-kafka

theme:
  name: material
  language: ru
  palette:
    - scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Светлая тема
    - scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: [ru, en]

docs_dir: .
site_dir: ../site
exclude_docs: |
  /en/
  /frontend/loading.md
  /frontend/ui-refactor.md
  /release-v4.3.2.md
  /mkdocs*.yml
  /render_releases.py

extra:
  alternate:
    - name: Русский
      link: /odyssey-kafka/
      lang: ru
    - name: English
      link: /odyssey-kafka/en/
      lang: en

nav:
  - Главная: index.md
  - Быстрый старт: getting-started.md
  - Установка и безопасность:
      - Мастер HTTPS: https-first-run.md
      - Docker и хранилище: docker-owner.md
      - Миграция: security-owner-migration.md
  - Руководство: guide.md
  - Архитектура: architecture.md
  - Что нового: whats-new.md
