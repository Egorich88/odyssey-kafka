name: odyssey

x-backend: &backend
  build:
    context: ./backend
  image: ${COMPOSE_PROJECT_NAME:-odyssey}-backend:local
  user: "1001:1001"
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  tmpfs: [/tmp]
  environment: &owner-environment
    ODYSSEY_HTTPS_RECEIPT: /run/https-status/active.json
    ODYSSEY_DATA_DIR: /var/lib/odyssey/data
    ODYSSEY_KEY_FILE: /var/lib/odyssey/keys/owner.key
    ODYSSEY_PUBLIC_ORIGIN: ${ODYSSEY_PUBLIC_ORIGIN:-https://localhost:8443}
    ODYSSEY_KAFKA_ALLOWED_NETWORKS: ${ODYSSEY_KAFKA_ALLOWED_NETWORKS:-}
    ODYSSEY_KAFKA_ALLOWED_PORTS: ${ODYSSEY_KAFKA_ALLOWED_PORTS:-}
    ODYSSEY_TLS_CERT_FILE: /run/tls/server.crt
    ODYSSEY_TLS_KEY_FILE: /run/tls/server.key

services:
  # Одноразовая подготовка только пустых приватных томов. Данные не сбрасываются.
  owner-storage-init:
    <<: *backend
    user: "0:0"
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    network_mode: none
    command: ["/usr/local/bin/owner-storage-init"]
    restart: "no"
    volumes:
      - owner-data:/var/lib/odyssey/data
      - owner-key:/var/lib/odyssey/keys

  # CA и серверные ключи создаются внутри отдельных томов, вне образов и Git.
  tls-init:
    build:
      context: ./docker
      dockerfile: Dockerfile.tls-init
    network_mode: none
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    environment:
      ODYSSEY_PUBLIC_HOST: ${ODYSSEY_PUBLIC_HOST:-localhost}
    volumes:
      - tls-ca:/state/ca
      - backend-tls:/state/backend
      - frontend-tls:/state/frontend

  https-manager:
    profiles: [setup]
    build:
      context: ./docker
      dockerfile: Dockerfile.tls-init
    entrypoint: [/usr/local/bin/https-manager]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    environment:
      ODYSSEY_PUBLIC_HOST: ${ODYSSEY_PUBLIC_HOST:-localhost}
      ODYSSEY_PUBLIC_ORIGIN: ${ODYSSEY_PUBLIC_ORIGIN:-https://localhost:8443}
    volumes:
      - tls-ca:/state/ca:ro
      - frontend-tls:/state/frontend
      - https-status:/state/public
    networks: [kafka-net]

  # Запускается вручную: docker compose --profile setup run --rm owner-init
  owner-init:
    <<: *backend
    profiles: [setup]
    command: ["kafka-backend", "owner-init"]
    stdin_open: true
    tty: true
    restart: "no"
    network_mode: none
    depends_on:
      owner-storage-init:
        condition: service_completed_successfully
    volumes:
      - owner-data:/var/lib/odyssey/data
      - owner-key:/var/lib/odyssey/keys

      - https-status:/run/https-status:ro

  backend-service:
    <<: *backend
    command: ["/bin/sh", "-ec", "while [ ! -s /var/lib/odyssey/data/owner.enc ]; do sleep 2; done; exec kafka-backend"]
    restart: unless-stopped
    depends_on:
      owner-storage-init:
        condition: service_completed_successfully
      tls-init:
        condition: service_completed_successfully
    volumes:
      - owner-data:/var/lib/odyssey/data
      - owner-key:/var/lib/odyssey/keys:ro
      - backend-tls:/run/tls:ro
      - https-status:/run/https-status:ro
    expose: ["8080"]
    networks: [kafka-net]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--cacert", "/run/tls/ca.crt", "https://backend-service:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  frontend-service:
    build:
      context: ./frontend
    image: ${COMPOSE_PROJECT_NAME:-odyssey}-frontend:local
    user: "101:101"
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      ODYSSEY_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-odyssey}
      ODYSSEY_PUBLIC_ORIGIN: ${ODYSSEY_PUBLIC_ORIGIN:-https://localhost:8443}
    ports:
      - "127.0.0.1:${ODYSSEY_SETUP_PORT:-8787}:8081"
      - "${ODYSSEY_HTTPS_BIND:-127.0.0.1}:${ODYSSEY_HTTPS_PORT:-8443}:8443"
    depends_on:
      backend-service:
        condition: service_started
      tls-init:
        condition: service_completed_successfully
    volumes:
      - frontend-tls:/run/tls:ro
      - https-status:/run/https-status:ro
    networks: [kafka-net]

  # Не запускается вместе с Odyssey автоматически и не затрагивает внешний Kafka.
  kafka:
    profiles: [local-kafka]
    image: apache/kafka:4.3.1
    restart: unless-stopped
    ports: ["127.0.0.1:9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [kafka-net]

networks:
  kafka-net:
    driver: bridge

volumes:
  https-status:
  owner-data:
  owner-key:
  tls-ca:
  backend-tls:
  frontend-tls:
