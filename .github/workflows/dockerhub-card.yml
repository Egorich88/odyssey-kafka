name: Update Docker Hub Card

on:
  schedule:
    - cron: "17 0,6,12,18 * * *"

  release:
    types: [published]

  workflow_dispatch:

  push:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/dockerhub-card.yml"
      - ".github/assets/dockerhub-logo.png"
      - ".github/assets/frontend-icon.png"
      - ".github/assets/backend-icon.png"
      - ".github/assets/logo.png"
      - ".github/assets/Comfortaa.woff2"
      - ".github/assets/OdysseyDisplay.woff2"
      - "frontend/package.json"

permissions:
  contents: write
  actions: read

concurrency:
  group: dockerhub-card
  cancel-in-progress: false

jobs:
  update-card:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.1.0
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Docker Hub card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: npx --yes tsx .github/scripts/dockerhub-card.ts

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/assets/dockerhub-card.svg

          if git diff --cached --quiet; then
            echo "Card has not changed."
            exit 0
          fi

          git commit -m "chore: update Docker Hub card"
          git push origin HEAD:main