name: CI/CD для Odyssey

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Kubernetes?'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_IMAGE_BACKEND: egorich27/kafka-control-backend
  DOCKER_IMAGE_FRONTEND: egorich27/kafka-control-frontend

jobs:
  # ────────────────────────────────────────────────────────────────
  # 1. VERIFY — быстрая проверка сборки на push в main
  #    Никаких образов в Docker Hub, только компиляция.
  # ────────────────────────────────────────────────────────────────
  verify:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache-dependency-path: backend/go.sum

      - name: Build backend
        working-directory: backend
        run: go build ./...

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ────────────────────────────────────────────────────────────────
  # 2. RELEASE — сборка и публикация образов только на тег v*
  # ────────────────────────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---- BACKEND ----
      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_IMAGE_BACKEND }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push Backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- FRONTEND ----
      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_IMAGE_FRONTEND }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- ГЕНЕРАЦИЯ CHANGELOG ----

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG="$(git tag --sort=-creatordate \
            | grep -Fvx "$CURRENT_TAG" \
            | head -n 1 || true)"

          if [[ -n "$PREV_TAG" ]]; then
            RANGE="${PREV_TAG}..${CURRENT_TAG}"
          else
            RANGE="$CURRENT_TAG"
          fi

          CHANGES="$(git log "$RANGE" \
            --pretty=format:'- %s' \
            --no-merges || true)"

          if [[ -z "$CHANGES" ]]; then
            CHANGES="- Изменения не указаны"
          fi

          {
            echo "changes<<CHANGELOG_EOF"
            printf '%s\n' "$CHANGES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # ---- СОЗДАНИЕ GITHUB RELEASE ----
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## 🚀 Release ${{ github.ref_name }}

            ### 📝 Что нового

            ${{ steps.changelog.outputs.changes }}

            ### 🐳 Docker образы

            - **Backend:** `egorich27/kafka-control-backend:${{ github.ref_name }}`
            - **Frontend:** `egorich27/kafka-control-frontend:${{ github.ref_name }}`

            ### 📦 Как запустить

            См. [README](https://github.com/${{ github.repository }}/blob/main/README.md)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ────────────────────────────────────────────────────────────────
  # 3. DEPLOY — только вручную через workflow_dispatch
  # ────────────────────────────────────────────────────────────────
  deploy-to-kubernetes:
    needs: release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install YC CLI and jq
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH
          sudo apt update
          sudo apt install -y jq

      - name: Configure YC and authenticate
        run: |
          export PATH="$HOME/yandex-cloud/bin:$PATH"
          echo "${{ secrets.YC_SA_JSON_KEY_BASE64 }}" | base64 -d > key.json
          yc config set service-account-key key.json
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          yc config set cloud-id ${{ secrets.YC_CLOUD_ID }}
          yc resource-manager folder get ${{ secrets.YC_FOLDER_ID }}

      - name: Get Kubeconfig for cluster
        run: |
          export PATH="$HOME/yandex-cloud/bin:$PATH"
          yc managed-kubernetes cluster get-credentials kafka-system-cluster --external --force
          kubectl cluster-info

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/kafka-system --timeout=30s
          kubectl apply -f k8s/
          kubectl rollout status deployment/backend -n kafka-system --timeout=90s
          kubectl rollout status deployment/frontend -n kafka-system --timeout=90s