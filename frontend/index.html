<!doctype html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1117" />
    <title>ODYSSEY — Kafka Monitoring & Management</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <script>
        // Восстанавливаем только оформление до первого кадра, без чтения профилей Kafka.
        try {
            const themes = ['dark','light','github-dark','github-light','dracula','nord','material','monokai-pro','solarized-dark','solarized-light','deep-ocean','mac','linux','coffee','kitty','rainbow'];
            const theme = localStorage.getItem('ksc_theme');
            if (themes.includes(theme)) document.documentElement.dataset.theme = theme;
            document.documentElement.lang = localStorage.getItem('ksc_language') === 'en' ? 'en' : 'ru';
        } catch {}
        // Восстановление работает до React и не обращается к backend/Kafka.
        let recoveryStarted = false;
        let recoveryStopped = false;
        let recoveryTimer;
        let probeAbort;
        const recoveryKey = 'odyssey_startup_auto_reload';
        const recoveryDelays = [3000, 5000, 10000, 15000, 30000, 30000];
        function recoverStartup() {
            if (recoveryStarted || !document.getElementById('initial-splash') || typeof fetch !== 'function') return;
            let reloads;
            try {
                const saved = JSON.parse(sessionStorage.getItem(recoveryKey) || 'null');
                reloads = saved && Date.now() - saved.at < 300000 ? Number(saved.count) : 0;
                if (!Number.isInteger(reloads) || reloads < 0 || reloads >= 2) return;
            } catch { return; }
            recoveryStarted = true;
            let attempt = 0;
            const schedule = () => {
                if (!recoveryStopped && attempt < recoveryDelays.length && document.getElementById('initial-splash')) {
                    recoveryTimer = window.setTimeout(probe, recoveryDelays[attempt++]);
                }
            };
            const probe = async () => {
                if (recoveryStopped || !document.getElementById('initial-splash') || document.getElementById('root')?.classList.contains('is-ready')) return;
                const script = Array.from(document.querySelectorAll('script[type="module"][src]')).at(-1);
                if (!script) return;
                const url = new URL(script.src, location.href);
                if (url.origin !== location.origin) return;
                probeAbort = new AbortController();
                const timeout = window.setTimeout(() => probeAbort?.abort(), 3000);
                try {
                    const response = await fetch(url.href, { method: 'HEAD', cache: 'no-store', redirect: 'error', signal: probeAbort.signal });
                    const mime = response.headers.get('content-type') || '';
                    if (response.ok && /(?:java|ecma)script/i.test(mime) && document.getElementById('initial-splash') && !document.getElementById('root')?.classList.contains('is-ready')) {
                        // Счётчик переживает reload, чтобы постоянная ошибка не создала цикл.
                        sessionStorage.setItem(recoveryKey, JSON.stringify({ count: reloads + 1, at: Date.now() }));
                        location.reload();
                        return;
                    }
                } catch {} finally { window.clearTimeout(timeout); }
                schedule();
            };
            schedule();
        }
        function failStartup() {
            const status = document.getElementById('initial-splash-status');
            const retry = document.getElementById('initial-splash-retry');
            const english = document.documentElement.lang === 'en';
            if (status) status.textContent = english ? 'Unable to start the Odyssey interface.\nTry reloading the page.' : 'Не удалось запустить интерфейс Odyssey.\nПопробуйте перезагрузить страницу.';
            if (retry) { retry.textContent = english ? 'Reload page' : 'Повторить загрузку'; retry.hidden = false; }
            recoverStartup();
        }
        window.addEventListener('error', function (event) {
            const moduleFailed = event.target instanceof HTMLScriptElement && event.target.type === 'module';
            const earlyError = event instanceof ErrorEvent && !document.getElementById('root')?.hasChildNodes();
            if (moduleFailed || earlyError) failStartup();
        }, true);
        window.addEventListener('odyssey-startup-failed', recoverStartup);
        window.addEventListener('odyssey-startup-ready', () => {
            recoveryStarted = true;
            recoveryStopped = true;
            window.clearTimeout(recoveryTimer);
            probeAbort?.abort();
            try { sessionStorage.removeItem(recoveryKey); } catch {}
        });
    </script>
    <link rel="stylesheet" href="/src/styles/themes.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet" />

    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg-primary, #0f1117); }
        #root { width: 100%; min-height: 100%; opacity: 0; transition: opacity 400ms ease; }
        #root.is-ready { opacity: 1; }
        #initial-splash {
            position: fixed; inset: 0; z-index: 999999;
            display: grid; place-items: center;
            background: var(--bg-primary, #0f1117);
            opacity: 1; transition: opacity 400ms ease;
        }
        #initial-splash.is-leaving { opacity: 0; pointer-events: none; }
        .initial-splash-logo-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: calc(100vw - 32px); }
        .initial-splash-logo { display: block; width: min(160px, 38vw); height: auto; aspect-ratio: 265 / 302.56; flex: none; filter: drop-shadow(0 10px 24px rgba(0,0,0,.35)); }
        #initial-splash-status {
            min-height: 44px; max-width: 440px; margin-top: 12px;
            color: var(--text-secondary, #d0d7de); font-family: Inter, sans-serif;
            font-size: 14px; font-weight: 400; line-height: 22px;
            letter-spacing: .2px; text-align: center; white-space: pre-line;
        }
        /* Существующая фирменная полоска сохранена без изменения визуального эффекта. */
        .initial-splash-pulse {
            width: 120px; height: 3px; border-radius: 999px;
            background: radial-gradient(ellipse at center, #55e6dc, rgba(34,220,200,.35) 45%, transparent 80%);
            box-shadow: 0 0 18px rgba(85,230,220,.45);
            animation: initialSplashGlow 1.8s ease-in-out infinite;
        }
        @keyframes initialSplashGlow {
            0%, 100% { opacity: .48; transform: scaleX(.82); }
            50% { opacity: 1; transform: scaleX(1.08); }
        }
        #initial-splash-retry { padding: 8px 12px; border: 1px solid var(--border-color, rgba(255,255,255,.15)); border-radius: var(--panel-radius, 8px); background: var(--panel-bg, #111827); color: var(--text-primary, #f8fafc); font: inherit; cursor: pointer; }
        #initial-splash-retry:focus-visible { outline: 2px solid var(--accent-color); outline-offset: 3px; }
        .startup-error { min-height: 100vh; display: grid; place-content: center; gap: 16px; padding: 24px; text-align: center; color: var(--text-primary); }
        .startup-error button { padding: 8px 12px; background: var(--panel-bg); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: var(--panel-radius); font: inherit; cursor: pointer; }
        .startup-error p { white-space: pre-line; }
        html[data-theme='light'] #initial-splash { background: var(--bg-primary, #f3f6fb); }
        html[data-theme='light'] #initial-splash-status { color: var(--text-secondary, #59636e); }
        html[data-theme='light'] #initial-splash-retry { background: var(--panel-bg, #fff); color: var(--text-primary, #0f172a); border-color: var(--border-color, #d0d7de); }
        @media (prefers-reduced-motion: reduce) {
            #root, #initial-splash { transition: none; }
            .initial-splash-pulse { animation: none; }
        }
    </style>
</head>
