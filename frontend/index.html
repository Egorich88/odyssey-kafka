<!--
 * ============================================================================
 * @file index.html
 * ============================================================================
 *
 * Главный HTML-документ frontend-приложения Kafka System Control.
 *
 * ----------------------------------------------------------------------------
 * Назначение
 * ----------------------------------------------------------------------------
 *
 * Этот файл является самым ранним этапом запуска frontend-приложения.
 *
 * Браузер загружает index.html до выполнения React и main.tsx.
 *
 * Файл отвечает только за:
 *
 * • базовую HTML-структуру страницы;
 * • подключение шрифтов;
 * • метаданные документа;
 * • ранний статический Splash Screen;
 * • DOM-контейнер для React;
 * • подключение точки входа React-приложения.
 *
 * ----------------------------------------------------------------------------
 * Что НЕ находится в index.html
 * ----------------------------------------------------------------------------
 *
 * Здесь не должно быть:
 *
 * • React-логики;
 * • Context Provider'ов;
 * • API-запросов;
 * • бизнес-логики;
 * • состояния приложения;
 * • логики загрузки Kafka;
 * • анимации React-компонентов.
 *
 * ----------------------------------------------------------------------------
 * Архитектура запуска
 * ----------------------------------------------------------------------------
 *
 * Browser
 *    ↓
 * index.html
 *    ↓
 * Static Splash
 *    ↓
 * main.tsx
 *    ↓
 * React
 *    ↓
 * LoadingDemo / LoadingScreen
 *    ↓
 * App
 *
 * ----------------------------------------------------------------------------
 * Важный принцип
 * ----------------------------------------------------------------------------
 *
 * Static Splash здесь является только самым ранним визуальным экраном.
 *
 * Он нужен для того, чтобы пользователь не видел белый экран в момент,
 * когда HTML уже загружен, но React ещё не начал отображать интерфейс.
 *
 * Полноценный Splash Screen находится в React-компонентах:
 *
 * src/components/loading/
 *
 * Его стили находятся в:
 *
 * src/components/loading/styles/loading-screen.css
 *
 * Поэтому сложные стили Loading Screen намеренно НЕ дублируются здесь.
 *
 * ============================================================================
-->

<!doctype html>

<html lang="en">

<head>

    <!-- =====================================================================
         Кодировка документа
    ====================================================================== -->

    <meta charset="UTF-8" />


    <!-- =====================================================================
         Адаптивность
    ====================================================================== -->

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    />


    <!-- =====================================================================
         Цвет браузерного интерфейса
    ====================================================================== -->

    <meta
            name="theme-color"
            content="#0f1117"
    />

    <!-- =====================================================================
         Заголовок приложения
    ====================================================================== -->

    <title>ODYSSEY — Kafka Monitoring & Management</title>

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />


    <!-- =====================================================================
         Шрифты приложения
    ======================================================================

         Orbitron:
         используется для фирменных элементов и заголовков.

         Inter:
         основной интерфейсный шрифт приложения.

         JetBrains Mono:
         техническая информация и Kafka-related данные.
    ====================================================================== -->

    <link
            href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&display=swap"
            rel="stylesheet"
    />

    <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
            rel="stylesheet"
    />

    <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
            rel="stylesheet"
    />

    <link
            href="https://fonts.googleapis.com/css2?family=Questrial&display=swap"
            rel="stylesheet"
    />


    <!-- =====================================================================
         Минимальные стили самого раннего этапа запуска
    ======================================================================

         Эти стили находятся непосредственно в index.html намеренно.

         Причина:
         внешний CSS и React ещё могут быть не загружены в момент,
         когда браузер уже начинает отображать HTML.

         Здесь оставлены ТОЛЬКО стили, необходимые для Static Splash.

         Все остальные стили Loading Screen находятся в:

         src/components/loading/styles/loading-screen.css
    ====================================================================== -->

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0f1117;
        }

        #root {
            width: 100%;
            min-height: 100%;
        }

        #initial-splash {
            position: fixed;
            inset: 0;
            z-index: 999999;
            display: grid;
            place-items: center;
            background: #0f1117;
        }

        .initial-splash-logo-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .initial-splash-logo-wrap img {
            width: 160px;
            height: auto;
            filter: drop-shadow(0 10px 24px rgba(0,0,0,.35));
        }

        .initial-splash-logo-wrap span {
            width: 120px;
            height: 3px;
            border-radius: 999px;
            background: radial-gradient(ellipse at center, #55e6dc, rgba(34,220,200,.35) 45%, transparent 80%);
            box-shadow: 0 0 18px rgba(85,230,220,.45);
            animation: initialSplashGlow 1.8s ease-in-out infinite;
        }

        @keyframes initialSplashGlow {
            0%, 100% { opacity: .48; transform: scaleX(.82); }
            50% { opacity: 1; transform: scaleX(1.08); }
        }
    </style>

</head>


<body>

<!-- =====================================================================
     Static Splash Screen
======================================================================

     Отображается непосредственно браузером до запуска React.

     Логотип находится внутри этого контейнера намеренно.

     После завершения React LoadingBootstrap удаляет #initial-splash.
====================================================================== -->




<!-- =====================================================================
     React Root
======================================================================

     В этот элемент React монтирует приложение.
====================================================================== -->

<div id="initial-splash" aria-label="ODYSSEY">
    <div class="initial-splash-logo-wrap">
        <img src="/logo.svg" alt="ODYSSEY" />
        <span></span>
    </div>
</div>

<div id="root"></div>


<!-- =====================================================================
     React Entry Point
====================================================================== -->

<script
        type="module"
        src="src/main.tsx"
></script>

</body>

</html>
