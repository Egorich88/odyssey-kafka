server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /run/tls/server.crt;
    ssl_certificate_key /run/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    # Раздача статики фронтенда
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Проксирование запросов к Go-бэкенду (слэши в конце важны!)
    location /api/ {
        proxy_pass https://backend-service:8080/api/;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /run/tls/ca.crt;
        proxy_ssl_verify_depth 2;
        proxy_ssl_server_name on;
        proxy_ssl_name backend-service;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # Проброс заголовков для бэкенда (Best Practices)
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
