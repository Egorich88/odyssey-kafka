server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /run/tls/live/server.crt;
    ssl_certificate_key /run/tls/live/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    location = /setup/odyssey-local-ca.crt {
        alias /run/tls/ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="odyssey-local-ca.crt"';
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
    }
    location = /setup/context.json { alias /tmp/odyssey-setup.json; default_type application/json; add_header Cache-Control "no-store"; }
    location = /setup/status.json {
        alias /run/https-status/active.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }
    location = /setup/ {
        root /usr/share/nginx/html;
        try_files /https-setup.html =404;
        default_type text/html;
        add_header Cache-Control "no-store";
    }
    # Раздача статики фронтенда
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Проксирование запросов к Go-бэкенду (слэши в конце важны!)
    location /api/ {
        proxy_pass https://backend-service:8080/api/;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /run/tls/ca.crt;
        proxy_ssl_verify_depth 2;
        proxy_ssl_server_name on;
        proxy_ssl_name backend-service;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # Проброс заголовков для бэкенда (Best Practices)
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 8081;
    server_name localhost;
    location = /setup/odyssey-local-ca.crt {
        alias /run/tls/ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="odyssey-local-ca.crt"';
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
    }
    location = /setup/context.json { alias /tmp/odyssey-setup.json; default_type application/json; add_header Cache-Control "no-store"; }
    location = /setup/status.json {
        alias /run/https-status/active.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }
    location = /setup/ {
        root /usr/share/nginx/html;
        try_files /https-setup.html =404;
        default_type text/html;
        add_header Cache-Control "no-store";
    }
    location = / { absolute_redirect off; return 302 /setup/; }
    location / { return 404; }
}
